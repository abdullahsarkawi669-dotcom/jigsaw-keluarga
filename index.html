<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kampung Jawa Warrior</title>
    <!--
      index.html — root-level redirect to the main app file.
      Acts as the canonical PWA start_url entry point so that:
        - Android Chrome's PWA launch (start_url: "./") gets a 200 response
          on every hosting platform (Netlify, Vercel, GitHub Pages, cPanel,
          Nginx, etc. all auto-serve index.html at the directory root).
        - If the user types the bare directory URL, they still land in the app.
      The redirect is double-redundant: meta-refresh + JS location.replace.
      If JS is disabled, the meta-refresh still kicks in after 0 seconds.
      If both fail, there's a manual link as a last resort.
    -->
    <meta http-equiv="refresh" content="0; url=./kampung-jawa-warrior.html">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./apple-touch-icon-180.png">
    <meta name="theme-color" content="#050510">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="KJ Warrior">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #050510;
            color: #00f3ff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .loader {
            font-size: 1rem;
            line-height: 1.6;
        }
        .loader a {
            color: #00f3ff;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="loader">
        <p>⚔️ Memuat Kampung Jawa Warrior…</p>
        <p style="font-size: 0.85rem; color: #aaa; margin-top: 12px;">
            Jika tidak otomatis teralihkan, <a href="./kampung-jawa-warrior.html">klik di sini</a>.
        </p>
    </div>
    <script>
        // location.replace replaces the current history entry so the back
        // button doesn't bounce back to this redirect page.
        // Preserves any query string (e.g. ?go=dashboard from the manifest
        // shortcut) so the deep-link still works after redirect.
        (function () {
            var target = './kampung-jawa-warrior.html' +
                (location.search ? location.search : '') +
                (location.hash ? location.hash : '');
            try {
                location.replace(target);
            } catch (e) {
                window.location.href = target;
            }
        })();
    </script>
</body>
</html>
